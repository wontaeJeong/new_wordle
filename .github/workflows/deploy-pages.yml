name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve base path
        id: base
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "$repo_name" = "${owner_name}.github.io" ]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$repo_name/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: VITE_BASE_PATH="${{ steps.base.outputs.base_path }}" npm run build

      - name: Check bundle budget
        run: npm run check:bundle

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Browser smoke test against deployed Pages URL
        run: PLAYWRIGHT_BASE_URL="${{ steps.deployment.outputs.page_url }}" npm run test:e2e:smoke

      - name: Verify deployed root security headers
        run: |
          headers="$(curl -fsSI "${{ steps.deployment.outputs.page_url }}")"
          printf '%s\n' "$headers" | grep -iF "cache-control: public, max-age=0, must-revalidate"
          printf '%s\n' "$headers" | grep -iF "content-security-policy: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
          printf '%s\n' "$headers" | grep -iF "x-content-type-options: nosniff"
          printf '%s\n' "$headers" | grep -iF "referrer-policy: strict-origin-when-cross-origin"
          printf '%s\n' "$headers" | grep -iF "permissions-policy: camera=(), geolocation=(), microphone=()"
          printf '%s\n' "$headers" | grep -iF "x-frame-options: DENY"

      - name: Verify deployed asset cache policy
        run: |
          html_file="$(mktemp)"
          curl -fsSL "${{ steps.deployment.outputs.page_url }}" -o "$html_file"
          asset_path="$(grep -oE '/assets/[^"'"'" ]+\.js' "$html_file" | head -n 1)"
          test -n "$asset_path"
          asset_headers="$(curl -fsSI "${{ steps.deployment.outputs.page_url }}${asset_path}")"
          printf '%s\n' "$asset_headers" | grep -iF "cache-control: public, max-age=31536000, immutable"

      - name: Verify deployed favicon cache policy
        run: |
          favicon_headers="$(curl -fsSI "${{ steps.deployment.outputs.page_url }}/favicon.svg")"
          printf '%s\n' "$favicon_headers" | grep -iF "cache-control: public, max-age=604800, stale-while-revalidate=86400"
