import groovy.json.JsonSlurper
import java.util.Properties

apply plugin: 'com.android.application'

def productionProperties = new Properties()
def productionPropertiesFile = rootProject.file('keystore.properties')
if (productionPropertiesFile.exists()) {
    productionPropertiesFile.withInputStream { productionProperties.load(it) }
}

def productionValue = { name ->
    productionProperties.getProperty(name) ?: project.findProperty(name)?.toString() ?: System.getenv(name)
}

def packageJson = new JsonSlurper().parse(rootProject.file('../package.json'))

def androidReleaseSigningKeys = [
    'ANDROID_KEYSTORE_PATH',
    'ANDROID_KEYSTORE_PASSWORD',
    'ANDROID_KEY_ALIAS',
    'ANDROID_KEY_PASSWORD'
]
def hasAndroidReleaseSigning = androidReleaseSigningKeys.every { productionValue(it) }
def androidVersionCode = (productionValue('ANDROID_VERSION_CODE') ?: '1').toInteger()
def androidVersionName = productionValue('ANDROID_VERSION_NAME') ?: packageJson.version.toString()

android {
    namespace = "com.dailylexicon.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (hasAndroidReleaseSigning) {
                storeFile rootProject.file(productionValue('ANDROID_KEYSTORE_PATH'))
                storePassword productionValue('ANDROID_KEYSTORE_PASSWORD')
                keyAlias productionValue('ANDROID_KEY_ALIAS')
                keyPassword productionValue('ANDROID_KEY_PASSWORD')
            }
        }
    }
    defaultConfig {
        applicationId "com.dailylexicon.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersionCode
        versionName androidVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (hasAndroidReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseBuildRequested = taskGraph.allTasks.any { it.path == ':app:bundleRelease' || it.path == ':app:assembleRelease' }
    if (releaseBuildRequested && !hasAndroidReleaseSigning) {
        def missing = androidReleaseSigningKeys.findAll { !productionValue(it) }.join(', ')
        throw new GradleException("Missing Android release signing config: ${missing}. Set these as environment variables or in android/keystore.properties.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
